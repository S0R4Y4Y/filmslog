{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div style="background-color: #2C2416; border-radius: 12px; padding: 2.5rem;">
      <form method="POST">
        <div class="form-group">
          <label style="color: #8FBFBF;">First Name <span style="color: #8FBFBF; font-size: 0.8rem;">(required)</span></label>
          <input type="text" class="form-control" name="firstName" placeholder="" required
            style="background-color: transparent; border: 1px solid #8FBFBF; color: #8FBFBF; border-radius: 8px;" />
        </div>
        <div class="form-group">
          <label style="color: #8FBFBF;">Email <span style="color: #8FBFBF; font-size: 0.8rem;">(required)</span></label>
          <input type="email" class="form-control" name="email" placeholder="" required
            style="background-color: transparent; border: 1px solid #8FBFBF; color: #8FBFBF; border-radius: 8px;" />
        </div>
        <div class="form-group">
          <label style="color: #8FBFBF;">Password <span style="color: #8FBFBF; font-size: 0.8rem;">(required)</span></label>
          <input type="password" class="form-control" name="password1" placeholder="" required
            style="background-color: transparent; border: 1px solid #8FBFBF; color: #8FBFBF; border-radius: 8px;" />
        </div>
        <div class="form-group">
          <label style="color: #8FBFBF;">Confirm Password <span style="color: #8FBFBF; font-size: 0.8rem;">(required)</span></label>
          <input type="password" class="form-control" name="password2" placeholder="" required
            style="background-color: transparent; border: 1px solid #8FBFBF; color: #8FBFBF; border-radius: 8px;" />
        </div>
        <button type="submit"
          style="width: 100%; background-color: #8FBfBF; color: #2C2416; border: none; border-radius: 30px; padding: 15px; font-size: 1rem; margin-top: 1rem; cursor: pointer;">
          Create Account
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
