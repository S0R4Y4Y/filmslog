{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}

<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <h4 style="color: #e8c97e; margin-bottom: 1.5rem; text-align: center;">Create Account</h4>
      <form method="POST">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="Enter email" required />
        </div>
        <div class="form-group">
          <label>First Name</label>
          <input type="text" class="form-control" name="firstName" placeholder="Enter first name" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" name="password1" placeholder="Enter password" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" class="form-control" name="password2" placeholder="Confirm password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block mt-3">Create Account</button>
      </form>
      <p style="color: #555; text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Already have an account? <a href="/login" style="color: #e8c97e;">Login</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
