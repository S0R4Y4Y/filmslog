{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="row justify-content-center" style="min-height: 80vh; align-items: center;">
  <div class="col-md-5">
    <form method="POST">
      <div class="form-group">
        <label style="color: #2C2416; font-size: 1rem;">Email <span style="font-size: 0.8rem;">(required)</span></label>
        <input type="email" name="email" required
          style="width: 100%; background-color: transparent; border: 1.5px solid #2C2416; color: #2C2416; border-radius: 30px; padding: 12px 20px; font-size: 1rem; outline: none;" />
      </div>
      <div class="form-group">
        <label style="color: #2C2416; font-size: 1rem;">Password <span style="font-size: 0.8rem;">(required)</span></label>
        <input type="password" name="password" required
          style="width: 100%; background-color: transparent; border: 1.5px solid #2C2416; color: #2C2416; border-radius: 30px; padding: 12px 20px; font-size: 1rem; outline: none;" />
      </div>
      <button type="submit"
        style="width: 100%; background-color: #2C2416; color: #8FBFBF; border: none; border-radius: 30px; padding: 15px; font-size: 1rem; margin-top: 1rem; cursor: pointer;">
        Login
      </button>
    </form>
    <p style="color: #2C2416; text-align: center; margin-top: 1rem; font-size: 0.9rem;">
      Don't have an account? <a href="/sign-up" style="color: #612D53;">Sign up</a>
    </p>
  </div>
</div>

{% endblock %}
