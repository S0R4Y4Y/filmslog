name: Deploy Filmslog

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 -t filmslog:latest .
          docker tag filmslog:latest 563355308046.dkr.ecr.ap-southeast-1.amazonaws.com/filmslog:latest
          docker push 563355308046.dkr.ecr.ap-southeast-1.amazonaws.com/filmslog:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-southeast-1 | sudo docker login --username AWS --password-stdin 563355308046.dkr.ecr.ap-southeast-1.amazonaws.com
            sudo docker pull 563355308046.dkr.ecr.ap-southeast-1.amazonaws.com/filmslog:latest
            sudo docker stop filmslog || true
            sudo docker rm filmslog || true
            sudo docker run -d -p 8080:5000 --name filmslog 563355308046.dkr.ecr.ap-southeast-1.amazonaws.com/filmslog:latest
 
